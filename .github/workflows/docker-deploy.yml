name: ci

on:
  push:
    branches: [ master ]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{secrets.DOCKERHUB_REPOSITORY}}:latest
          platforms: linux/amd64, linux/arm64/v8
          # Reuse unchanged layers (dependencies) between builds. Without the cache
          # every build produces new layer digests and the server re-downloads and
          # unpacks all of node_modules on each update.
          cache-from: type=gha
          cache-to: type=gha,mode=max
